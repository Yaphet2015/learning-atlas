name: macOS preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Download Electron runtime
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Verify Electron embedded Node, SQLite and durable reopen
        timeout-minutes: 3
        run: ATLAS_SMOKE_TEST=1 ./node_modules/.bin/electron .
      - name: Install test browser
        run: npx playwright install chromium
      - name: Verify canvas interactions
        run: npm run test:e2e
      - name: Package Apple Silicon preview
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: Learning-Atlas-macOS-arm64-preview
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - name: Upload UI verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-ui-verification
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
