name: macOS preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a main build mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version is pinned by the packageManager field in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Download Electron runtime
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Verify Electron embedded Node, SQLite and durable reopen
        timeout-minutes: 3
        run: STUDYBOARD_SMOKE_TEST=1 ./node_modules/.bin/electron .
      - name: Install test browser
        run: pnpm exec playwright install chromium
      - name: Verify canvas interactions
        run: pnpm test:e2e
      - name: Package Apple Silicon preview
        run: pnpm dist:mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged app, SQLite and durable reopen
        timeout-minutes: 3
        run: |
          set -euo pipefail
          app="release/mac-arm64/Studyboard.app/Contents/MacOS/Studyboard"
          test -x "$app"
          mkdir -p test-results
          smoke_data="$(mktemp -d "${RUNNER_TEMP}/studyboard-packaged-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_data"' EXIT
          STUDYBOARD_E2E=1 STUDYBOARD_TEST_USERDATA="$smoke_data" STUDYBOARD_SMOKE_TEST=1 \
            "$app" 2>&1 | tee test-results/packaged-smoke.log
          grep -F '[smoke] durable reopen verified' test-results/packaged-smoke.log
          grep -F '[smoke] complete; quitting Electron' test-results/packaged-smoke.log
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: Studyboard-macOS-arm64-preview
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - name: Upload UI verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-ui-verification
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # Every merge to main replaces the assets on one rolling "latest" release,
  # so the download URLs in README.md always point at the newest build.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Studyboard-macOS-arm64-preview
          path: artifact
      - name: Give the build stable file names
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifact/*-arm64.dmg)
          zips=(artifact/*-arm64.zip)
          test "${#dmgs[@]}" -eq 1 && test "${#zips[@]}" -eq 1
          mkdir -p upload
          cp "${dmgs[0]}" upload/Studyboard-arm64.dmg
          cp "${zips[0]}" upload/Studyboard-arm64.zip
          ls -l upload
      - name: Publish rolling "latest" release
        run: |
          set -euo pipefail
          tag=latest
          notes="Automatic build of ${GITHUB_SHA::7} from main ($(date -u +%Y-%m-%dT%H:%MZ)).
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Unsigned Apple Silicon preview (ad-hoc signature, not notarized). See README for opening it."
          # Move (or create) the tag to the commit that was just built.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Studyboard (latest main)" \
              --notes "$notes" --draft=false --prerelease=false --latest
            gh release upload "$tag" upload/* --clobber
            # Drop assets from older names (e.g. Learning-Atlas-arm64.dmg) so
            # the release only offers the current build.
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while read -r name; do
                if [ ! -f "upload/$name" ]; then
                  echo "Deleting stale asset $name"
                  gh release delete-asset "$tag" "$name" --yes
                fi
              done
          else
            gh release create "$tag" upload/* --verify-tag \
              --title "Studyboard (latest main)" --notes "$notes" --latest
          fi
